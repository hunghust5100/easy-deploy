version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: easydeploy-postgres
    environment:
      POSTGRES_DB: easydeploydb
      POSTGRES_USER: easydeploy
      POSTGRES_PASSWORD: easydeploy_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
